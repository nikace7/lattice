components:
  schemas:
    AccessEnum:
      enum:
      - WORKSPACE
      - RESTRICTED
      type: string
      description: |-
        * `WORKSPACE` - Everyone in this workspace
        * `RESTRICTED` - Selected people
    BlockData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        position:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        originalText:
          type: string
        locator:
          readOnly: true
        spanMap: {}
      required:
      - id
      - locator
      - originalText
      - position
      - spanMap
      - text
    CollectionCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        access:
          allOf:
          - $ref: '#/components/schemas/AccessEnum'
          default: WORKSPACE
      required:
      - title
    CollectionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        access:
          allOf:
          - $ref: '#/components/schemas/AccessEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        canWrite:
          type: boolean
          readOnly: true
      required:
      - access
      - canWrite
      - id
      - revision
      - title
    CredentialsRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    DocumentData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        collectionId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        revision:
          type: integer
          readOnly: true
        kind:
          type: string
        byteSize:
          type: integer
        sha256:
          type: string
        state:
          type: string
        error:
          type: string
        retryable:
          type: boolean
        pageCount:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          readOnly: true
        canWrite:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
      required:
      - byteSize
      - canWrite
      - collectionId
      - createdAt
      - error
      - id
      - kind
      - pageCount
      - retryable
      - revision
      - sha256
      - sourceId
      - state
      - title
      - warnings
    EmailInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    GrantData:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        canRead:
          type: boolean
        canWrite:
          type: boolean
      required:
      - canRead
      - canWrite
      - membershipId
    GrantInputRequest:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        canRead:
          type: boolean
        canWrite:
          type: boolean
      required:
      - canRead
      - canWrite
      - membershipId
    GrantsEditRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GrantInputRequest'
      required:
      - expectedRevision
      - grants
    InvitationData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
      required:
      - email
      - expiresAt
      - id
      - role
    InviteInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: MEMBER
      required:
      - email
    LiveStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LiveStatusStatusEnum'
      required:
      - status
    LiveStatusStatusEnum:
