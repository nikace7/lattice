components:
  schemas:
    AccessEnum:
      enum:
      - WORKSPACE
      - RESTRICTED
      type: string
      description: |-
        * `WORKSPACE` - Everyone in this workspace
        * `RESTRICTED` - Selected people
    AnswerBlockData:
      type: object
      properties:
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationData'
      required:
      - citations
      - text
    AnswerCapabilityData:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      required:
      - enabled
      - message
    AnswerData:
      type: object
      properties:
        status:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AnswerBlockData'
        repaired:
          type: boolean
        omittedPassages:
          type: integer
      required:
      - blocks
      - omittedPassages
      - repaired
      - status
    BlockData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        position:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        originalText:
          type: string
        locator:
          readOnly: true
        spanMap: {}
      required:
      - id
      - locator
      - originalText
      - position
      - spanMap
      - text
    CitationData:
      type: object
      properties:
        evidenceId:
          type: string
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        indexId:
          type: string
          format: uuid
        title:
          type: string
        partial:
          type: boolean
        quote:
          type: string
        chunkStart:
          type: integer
        chunkEnd:
          type: integer
        spans:
          type: array
          items:
            $ref: '#/components/schemas/CitationSpanData'
      required:
      - chunkEnd
      - chunkId
      - chunkStart
      - documentId
      - evidenceId
      - indexId
      - partial
      - quote
      - sourceId
      - spans
      - title
    CitationSpanData:
      type: object
      properties:
        blockId:
          type: string
          format: uuid
        start:
          type: integer
        end:
          type: integer
        location: {}
      required:
      - blockId
      - end
      - location
      - start
    CollectionCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        access:
          allOf:
          - $ref: '#/components/schemas/AccessEnum'
          default: WORKSPACE
      required:
      - title
    CollectionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        access:
          allOf:
          - $ref: '#/components/schemas/AccessEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        canWrite:
          type: boolean
          readOnly: true
      required:
      - access
      - canWrite
      - id
      - revision
      - title
    ConversationData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 80
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - title
    CredentialsRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    DocumentData:
      type: object
      properties:
        sourceNumber:
          type: integer
        currentSourceId:
          type: string
          nullable: true
          readOnly: true
        index:
          allOf:
          - $ref: '#/components/schemas/IndexData'
          nullable: true
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        collectionId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        revision:
          type: integer
          readOnly: true
        kind:
          type: string
        byteSize:
          type: integer
        sha256:
          type: string
        state:
          type: string
        error:
          type: string
        retryable:
          type: boolean
        ocrLanguage:
          type: string
        pageReports:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        excludedPages:
          type: array
          items:
            type: integer
          readOnly: true
        reviewReason:
          type: string
          readOnly: true
        pageCount:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          readOnly: true
        canWrite:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
      required:
      - byteSize
      - canWrite
      - collectionId
      - createdAt
      - currentSourceId
      - error
      - excludedPages
      - id
      - index
      - kind
      - ocrLanguage
      - pageCount
      - pageReports
      - retryable
      - reviewReason
      - revision
      - sha256
      - sourceId
      - sourceNumber
      - state
      - title
      - warnings
    DocumentStatusData:
      type: object
      properties:
        total:
          type: integer
        ready:
          type: integer
        processing:
          type: integer
      required:
      - processing
      - ready
      - total
    EmailInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    EvaluationCaseData:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
        language:
          type: string
        query:
          type: string
        fullEvidence:
          type: boolean
        expected:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDocumentData'
        retrieved:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDocumentData'
      required:
      - expected
      - fullEvidence
      - id
      - language
      - mode
      - query
      - retrieved
    EvaluationData:
      type: object
      properties:
        id:
          type: string
        suite:
          type: string
        suiteHash:
          type: string
        profile: {}
        backend:
          type: string
        elapsedSeconds:
          type: number
          format: double
        description:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationRowData'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCaseData'
      required:
      - backend
      - cases
      - description
      - elapsedSeconds
      - id
      - profile
      - rows
      - suite
      - suiteHash
    EvaluationDocumentData:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
      required:
      - id
      - text
      - title
    EvaluationRowData:
      type: object
      properties:
        mode:
          type: string
        language:
          type: string
        questions:
          type: integer
        goldGroupsFound:
          type: integer
        goldGroups:
          type: integer
        evidenceRecallAt8:
          type: number
          format: double
        anyHitQuestions:
          type: integer
        fullEvidenceQuestions:
          type: integer
        meanReciprocalRank:
          type: number
          format: double
      required:
      - anyHitQuestions
      - evidenceRecallAt8
      - fullEvidenceQuestions
      - goldGroups
      - goldGroupsFound
      - language
      - meanReciprocalRank
      - mode
      - questions
    GrantData:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        canRead:
          type: boolean
        canWrite:
          type: boolean
      required:
      - canRead
      - canWrite
      - membershipId
    GrantInputRequest:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        canRead:
          type: boolean
        canWrite:
          type: boolean
      required:
      - canRead
      - canWrite
      - membershipId
    GrantsEditRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GrantInputRequest'
      required:
      - expectedRevision
      - grants
    IndexData:
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/IndexDataStateEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        chunkCount:
          type: integer
        error:
          type: string
          readOnly: true
        canRetry:
          type: boolean
        semantic:
          type: boolean
          readOnly: true
      required:
      - active
      - canRetry
      - chunkCount
      - error
      - semantic
      - state
    IndexDataStateEnum:
      enum:
      - QUEUED
      - CHUNKING
      - EMBEDDING
      - READY
      - FAILED
      - CANCELLED
      type: string
      description: |-
        * `QUEUED` - Queued
        * `CHUNKING` - Chunking
        * `EMBEDDING` - Embedding
        * `READY` - Ready
        * `FAILED` - Failed
        * `CANCELLED` - Cancelled
    InvitationData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
      required:
      - email
      - expiresAt
      - id
      - role
    InviteInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: MEMBER
      required:
      - email
    LiveStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LiveStatusStatusEnum'
      required:
      - status
    LiveStatusStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    MembershipCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - username
    MembershipData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        revision:
          type: integer
          readOnly: true
      required:
      - active
      - id
      - revision
      - role
      - username
    MessageData:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ModeEnum:
      enum:
      - KEYWORD
      - SEMANTIC
      - HYBRID
      type: string
      description: |-
        * `KEYWORD` - KEYWORD
        * `SEMANTIC` - SEMANTIC
        * `HYBRID` - HYBRID
    OcrLanguageEnum:
      enum:
      - eng
      - nep
      - eng+nep
      type: string
      description: |-
        * `eng` - eng
        * `nep` - nep
        * `eng+nep` - eng+nep
    PaginatedBlockDataList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/BlockData'
    PaginatedCollectionDataList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
