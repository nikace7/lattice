name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lattice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://lattice:ci-only-password@localhost:5432/lattice
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret-key-never-use-outside-test-environments
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
      - run: pnpm run setup
      - run: docker compose config --quiet
      - run: pnpm migrate
      - run: pnpm verify
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- contracts/openapi.yaml apps/web/src/lib/api.generated.ts
      - run: pnpm --filter @lattice/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: apps/web/test-results
          if-no-files-found: ignore
