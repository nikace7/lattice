[project]
name = "lattice-backend"
version = "0.1.0"
description = "Lattice cited knowledge workspace API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery==5.6.3",
    "defusedxml==0.7.1",
    "django==5.2.17",
    "django-environ==0.14.0",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "pdfplumber==0.11.10",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.9",
]

[project.optional-dependencies]
local = ["transformers==5.20.1", "torch==2.14.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
